<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>VoxelCraft Reborn · Browser Voxel Sandbox</title>
<style>
  :root { --mc-font: "Courier New", ui-monospace, monospace; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: var(--mc-font); user-select: none; -webkit-user-select: none; }
  #game, #hud { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #game { z-index: 1; }
  #hud { z-index: 2; pointer-events: none; }

  .screen {
    position: fixed; inset: 0; z-index: 5; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-shadow: 2px 2px 0 #3f3f3f;
  }
  #title-screen { background: rgba(0,0,0,0.18); }
  #title-logo {
    font-size: clamp(38px, 7vw, 72px);
    font-weight: 900;
    letter-spacing: 0.08em;
    line-height: 0.95;
    text-align: center;
    color: #f2f4f7;
    text-shadow: 0 5px 0 #23272b, 0 9px 18px rgba(0,0,0,.55);
    animation: logo-pulse 3.2s ease-in-out infinite;
  }
  #title-logo span { display:block; margin-top:10px; font-size:.28em; letter-spacing:.38em; color:#b7d88a; text-shadow:0 2px 0 #253315; }
  @keyframes logo-pulse {
    0%,100% { transform: scale(1); } 50% { transform: scale(1.035); }
  }
  .mc-btn {
    font-family: var(--mc-font); font-size: 17px; color: #fff;
    background: linear-gradient(#8b8b8b, #6b6b6b 45%, #555 55%, #777);
    border: 2px solid #000; outline: 2px solid #fff; padding: 9px 42px;
    margin: 8px; cursor: pointer; text-shadow: 2px 2px 0 #3a3a3a;
    image-rendering: pixelated;
  }
  .mc-btn:hover:not(:disabled) {
    background: linear-gradient(#9f9fcf, #7c7cb8 45%, #6565a5 55%, #8989c0);
    outline-color: #ffffa0;
  }
  .mc-btn:disabled { opacity: .45; cursor: default; }
  #title-actions { margin-top: 42px; display: flex; flex-direction: column; align-items: center; }
  #title-note { margin-top: 26px; font-size: 13px; color: #ddd; text-shadow: 1px 1px #000; text-align:center; line-height: 1.7; }
  #loading-screen { background: #201810; }
  #loading-bar-wrap { width: 320px; height: 18px; border: 2px solid #fff; margin-top: 18px; background:#000; }
  #loading-bar { height: 100%; width: 0%; background:#6f6f6f; }

  #pause-screen { background: rgba(0,0,0,0.42); }
  #options-screen {
    background-image: url('assets/textures/gui/options_background.png');
    background-size: 32px 32px; image-rendering: pixelated;
  }
  .menu-panel {
    background: #c6c6c6; color: #fff; border: 2px solid #000; outline: 3px solid #fff;
    padding: 26px 34px; display: flex; flex-direction: column; align-items: center;
    text-shadow: 2px 2px 0 #3f3f3f; min-width: 340px;
  }
  .menu-title { font-size: 30px; margin-bottom: 14px; color:#fff; }
  #options-screen .menu-panel { background: rgba(0,0,0,0.72); }
  .opt-row { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 7px 0; font-size: 14px; }
  .opt-row input[type=range] { width: 170px; }
  .small { font-size: 12px; color: #ddd; }
  #picker-screen { background: rgba(0,0,0,0.5); }
  #picker-panel {
    width: min(640px, 92vw); background: #c6c6c6; border: 2px solid #000; outline: 3px solid #fff;
    padding: 18px; display: flex; flex-wrap: wrap; gap: 4px; max-height: 78vh; overflow:auto;
  }
  .pick-cell {
    width: 52px; height: 56px; border: 2px solid #5a5a5a; background: #8b8b8b;
    display:flex; flex-direction: column; align-items:center; justify-content:center; cursor:pointer;
  }
  .pick-cell:hover { background:#9f9fcf; border-color:#fff; }
  .pick-cell img, .pick-cell canvas { width: 36px; height: 36px; image-rendering: pixelated; }
  .pick-cell span { font-size: 10px; color:#fff; text-shadow:1px 1px #000; max-width:48px; overflow:hidden; white-space:nowrap; }
  .hidden { display: none !important; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js"
  }
}
</script>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="hud"></canvas>

  <div id="title-screen" class="screen">
    <div id="title-logo">VOXELCRAFT<span>REBORN</span></div>
    <div id="title-actions">
      <button id="btn-play" class="mc-btn" disabled>正在装载资源…</button>
      <div id="title-note">
        W A S D 移动 · 鼠标视角 · 空格跳跃（双击=飞行）· Shift 潜行 · Ctrl 疾跑<br/>
        左键破坏 · 右键放置 · 中键取色 · E 方块选择 · F3 调试 · F5 视角 · G 模式<br/>
        1-9 / 滚轮 切换热栏 · ESC 菜单<br/><span style="opacity:.72">独立体素沙盒项目 · 不隶属于 Mojang 或 Microsoft</span>
      </div>
    </div>
  </div>

  <div id="loading-screen" class="screen hidden">
    <div class="menu-title">正在生成地形</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <div class="small" id="loading-text"></div>
  </div>

  <div id="pause-screen" class="screen hidden">
    <div class="menu-panel">
      <div class="menu-title">游戏菜单</div>
      <button id="btn-resume" class="mc-btn">回到游戏</button>
      <button id="btn-options" class="mc-btn">选项…</button>
      <button id="btn-quit-title" class="mc-btn">保存并回到标题画面</button>
    </div>
  </div>

  <div id="options-screen" class="screen hidden">
    <div class="menu-panel">
      <div class="menu-title">选项</div>
      <div class="opt-row"><span>渲染距离</span><input id="opt-distance" type="range" min="2" max="8" step="1" value="4" /><span id="opt-distance-v">4</span></div>
      <div class="opt-row"><span>视野 (FOV)</span><input id="opt-fov" type="range" min="60" max="110" step="1" value="70" /><span id="opt-fov-v">70</span></div>
      <div class="opt-row"><span>鼠标灵敏度</span><input id="opt-sens" type="range" min="30" max="180" step="5" value="100" /><span id="opt-sens-v">100%</span></div>
      <div class="opt-row"><span>音量</span><input id="opt-vol" type="range" min="0" max="100" step="5" value="70" /><span id="opt-vol-v">70%</span></div>
      <div class="opt-row"><span>音乐</span><input id="opt-music" type="checkbox" checked /></div>
      <div class="opt-row"><span>创造模式</span><input id="opt-creative" type="checkbox" checked /></div>
      <button id="btn-options-back" class="mc-btn">完成</button>
    </div>
  </div>

  <div id="picker-screen" class="screen hidden">
    <div id="picker-panel"></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
